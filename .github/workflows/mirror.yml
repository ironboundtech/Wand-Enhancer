name: Mirror to GitLab

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitLab token
        id: token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GITLAB_TOKEN is not configured; skipping mirror."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - name: Push to GitLab
        if: steps.token.outputs.configured == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: kitbyte
          GITLAB_REPO: Wand-Enhancer
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_USERNAME}/${GITLAB_REPO}.git"
          git push gitlab --all --force
          git push gitlab --tags --force
